name: data

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: test
        run: go test ./...

      - name: build
        run: go build -ldflags="-s -w" -o hosts-rules ./cmd/hosts-rules

      - name: run (base)
        run: ./hosts-rules

      - name: run (full)
        run: ./hosts-rules --full

      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: data-${{ github.run_number }}
          name: data-${{ github.run_number }}
          body: |
            Automated rule build.
            Sources: 40 (base) / 81 (full)
          files: |
            dist/accelerate.txt
            dist/easylist.txt
            dist/adblock.txt
            dist/accelerate_full.txt
            dist/easylist_full.txt
            dist/adblock_full.txt
            hosts-rules

      - name: commit stats
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/static/data
          git diff --cached --quiet || git commit -m "data: build ${{ github.run_number }}"
          git push

      # GITHUB_TOKEN 触发的 push 不会再触发其它 workflow（GitHub 防递归），
      # 所以 stats 提交后必须显式 dispatch pages，否则统计页冻结在旧数据。
      - name: trigger pages
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"main"}'
