baseURL = "https://zy-xyz.github.io/hosts-rules/"

# theme
theme = "LoveIt"

# website title
title = "hosts-rules"

# default content language
defaultContentLanguage = "zh-cn"
languageCode = "zh-CN"
languageName = "简体中文"
hasCJKLanguage = true

# whether to use robots.txt
enableRobotsTXT = true
# whether to use emoji code
enableEmoji = true

[pagination]
  disableAliases = false
  pagerSize = 10
  path = "page"

# Menu config
[menu]
  [[menu.main]]
    weight = 1
    identifier = "status"
    name = "构建状态"
    url = "/"
  [[menu.main]]
    weight = 2
    identifier = "rules"
    name = "规则订阅"
    url = "/rules/"
  [[menu.main]]
    weight = 3
    identifier = "adr"
    name = "设计决策"
    url = "/adr/"

[params]
  # site default theme ["auto", "light", "dark"]
  defaultTheme = "auto"
  # date format
  dateFormat = "2006-01-02"
  # website title for Open Graph and Twitter Cards
  title = "hosts-rules"
  # website description
  description = "多上游广告/跟踪域名规则构建器 —— 按消费端语法路由到 hosts / AdGuard Home / uBlock Origin"

  # Author config
  [params.author]
    name = "zy"

  # Header config
  [params.header]
    desktopMode = "fixed"
    mobileMode = "auto"
    [params.header.title]
      logo = ""
      name = "hosts-rules"
      pre = "<i class='fas fa-shield-halved fa-fw' aria-hidden='true'></i>"
      post = ""

  # Footer config
  [params.footer]
    enable = true
    custom = ""
    hugo = false
    copyright = true
    author = true
    since = 2026
    icp = ""
    license = '<a rel="license external nofollow noopener noreffer" href="https://github.com/zy-xyz/hosts-rules/blob/main/LICENSE" target="_blank">MIT</a>'

  # Home page config
  [params.home]
    rss = 10
    [params.home.profile]
      enable = false
    [params.home.posts]
      enable = false

  # Social config
  [params.social]
    GitHub = "zy-xyz"

  # App icon config
  [params.app]
    title = "hosts-rules"
    noFavicon = true

  # Page config
  [params.page]
    [params.page.share]
      enable = false
    [params.page.comment]
      enable = false
