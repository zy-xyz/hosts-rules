{{- define "content" -}}
<link rel="stylesheet" href="{{ "css/dashboard.css" | relURL }}">
<div class="hr-dash">
<div class="sub" id="sub">加载中…</div>

  <div class="cards" id="cards"></div>

  <div class="grid">
    <div class="panel"><h2>三桶行数</h2><canvas id="buckets" height="200"></canvas></div>
    <div class="panel"><h2>趋势（最近 30 次）</h2><canvas id="trend" height="200"></canvas></div>
  </div>

  <div class="grid" style="margin-top:16px">
    <div class="panel"><h2>源贡献 Top 15</h2><div id="contrib"></div></div>
    <div class="panel"><h2>抓取失败</h2><div id="failed"></div></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
const S = "{{ "data/stats.json" | relURL }}";
const H = "{{ "data/history.jsonl" | relURL }}";
// 图表配色跟随 LoveIt 主题（明/暗）
function hrTheme(){
  const cs = getComputedStyle(document.querySelector('.hr-dash') || document.body);
  const g = n => cs.getPropertyValue(n).trim();
  const dark = document.body.getAttribute('theme') === 'dark';
  return {
    acc: g('--hr-acc') || '#2d96bd',
    easy: g('--hr-easy') || '#2e9e5b',
    ad: g('--hr-ad') || '#8b5cf6',
    dim: g('--hr-dim') || '#a9a9b3',
    grid: dark ? 'rgba(255,255,255,.08)' : 'rgba(0,0,0,.07)'
  };
}
const fmt = n => (n ?? 0).toLocaleString("en-US");

async function main(){
  const T = hrTheme();
  let stats;
  try { stats = await (await fetch(S, {cache:"no-store"})).json(); }
  catch(e){ document.getElementById("sub").textContent = "尚无构建数据（stats.json 未生成）"; return; }

  const b = stats.buckets;
  const total = b.accelerate + b.easylist + b.adblock;
  const failed = stats.failed_sources || [];

  document.getElementById("sub").innerHTML =
    `${new Date(stats.timestamp).toLocaleString("zh-CN")} · ${stats.full?"full 源集":"base 源集"} · 耗时 ${stats.duration_s.toFixed(1)}s`;

  document.getElementById("cards").innerHTML = [
    ["总规则", fmt(total), ""],
    ["accelerate", fmt(b.accelerate), "var(--hr-acc)"],
    ["easylist (AGH)", fmt(b.easylist), "var(--hr-easy)"],
    ["adblock (uBO)", fmt(b.adblock), "var(--hr-ad)"],
    ["源", `${stats.total_sources - failed.length}/${stats.total_sources}`, failed.length?"#e5a54b":"var(--hr-easy)"],
    ["输入行", fmt(stats.raw_lines), ""],
  ].map(([k,v,c])=>`<div class="card"><div class="k">${k}</div><div class="v" style="color:${c||"inherit"}">${v}</div></div>`).join("");

  new Chart(document.getElementById("buckets"), {
    type:"doughnut",
    data:{labels:["accelerate","easylist (AGH)","adblock (uBO)"],
      datasets:[{data:[b.accelerate,b.easylist,b.adblock],
        backgroundColor:[T.acc,T.easy,T.ad],borderWidth:0}]},
    options:{plugins:{legend:{labels:{color:T.dim,boxWidth:12}}},cutout:"58%"}
  });

  const sc = (stats.source_contrib||[]).filter(s=>s.domains>0).slice(0,15);
  document.getElementById("contrib").innerHTML = sc.length ? `<table>
    <tr><th>源</th><th>域名</th><th>字节</th><th>耗时</th></tr>
    ${sc.map(s=>`<tr><td class="url" title="${s.url}">${s.url.replace(/^https?:\/\//,"")}</td>
      <td class="n">${fmt(s.domains)}</td><td class="n">${fmt(s.bytes)}</td>
      <td class="n">${s.duration_s.toFixed(1)}s</td></tr>`).join("")}
  </table>` : '<div class="empty">无数据</div>';

  document.getElementById("failed").innerHTML = failed.length
    ? `<div class="fail bad">共 ${failed.length} 个源失败</div><div style="margin-top:8px">${failed.map(u=>`<div class="fail">· ${u.replace(/^https?:\/\//,"")}</div>`).join("")}</div>`
    : '<div class="ok">全部源抓取成功</div>';

  try {
    const txt = await (await fetch(H,{cache:"no-store"})).text();
    const rows = txt.split("\n").filter(Boolean).map(l=>JSON.parse(l)).slice(-30);
    new Chart(document.getElementById("trend"), {
      type:"line",
      data:{labels:rows.map(r=>new Date(r.timestamp).toLocaleDateString("zh-CN")),
        datasets:[
          {label:"easylist",data:rows.map(r=>r.buckets.easylist),borderColor:T.easy,tension:.3,pointRadius:0},
          {label:"adblock",data:rows.map(r=>r.buckets.adblock),borderColor:T.ad,tension:.3,pointRadius:0},
          {label:"accelerate",data:rows.map(r=>r.buckets.accelerate),borderColor:T.acc,tension:.3,pointRadius:0},
        ]},
      options:{plugins:{legend:{labels:{color:T.dim,boxWidth:12}}},
        scales:{x:{ticks:{color:T.dim,maxTicksLimit:6},grid:{color:T.grid}},
                y:{ticks:{color:T.dim},grid:{color:T.grid}}}}
    });
  } catch(e){}
}
main();
</script>
{{- end -}}
