<!DOCTYPE html>
<html lang="zh-cn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hosts-new · 规则构建状态</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{--bg:#0f1115;--card:#171a21;--fg:#e6e9ef;--dim:#8b94a7;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--acc:#58a6ff;--easy:#3fb950;--ad:#bc8cff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif}
  .wrap{max-width:1080px;margin:0 auto;padding:32px 20px 64px}
  h1{font-size:24px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:24px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:24px}
  .card{background:var(--card);border:1px solid #232733;border-radius:10px;padding:16px}
  .card .k{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  .card .v{font-size:26px;font-weight:600;margin-top:6px;font-variant-numeric:tabular-nums}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:760px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid #232733;border-radius:10px;padding:16px}
  .panel h2{font-size:14px;margin:0 0 12px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:5px 8px;border-bottom:1px solid #232733}
  th{color:var(--dim);font-weight:500}
  td.n{text-align:right;font-variant-numeric:tabular-nums}
  .url{max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,monospace;font-size:12px}
  .ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
  .fail{font-family:ui-monospace,monospace;font-size:12px;word-break:break-all}
  .empty{color:var(--dim);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <h1>hosts-new</h1>
  <div class="sub" id="sub">加载中…</div>

  <div class="cards" id="cards"></div>

  <div class="grid">
    <div class="panel"><h2>三桶行数</h2><canvas id="buckets" height="200"></canvas></div>
    <div class="panel"><h2>趋势（最近 30 次）</h2><canvas id="trend" height="200"></canvas></div>
  </div>

  <div class="grid" style="margin-top:16px">
    <div class="panel"><h2>源贡献 Top 15</h2><div id="contrib"></div></div>
    <div class="panel"><h2>抓取失败</h2><div id="failed"></div></div>
  </div>
</div>

<script>
const S = "{{ "data/stats.json" | relURL }}";
const H = "{{ "data/history.jsonl" | relURL }}";
const fmt = n => (n ?? 0).toLocaleString("en-US");

async function main(){
  let stats;
  try { stats = await (await fetch(S, {cache:"no-store"})).json(); }
  catch(e){ document.getElementById("sub").textContent = "尚无构建数据（stats.json 未生成）"; return; }

  const b = stats.buckets;
  const total = b.accelerate + b.easylist + b.adblock;
  const failed = stats.failed_sources || [];

  document.getElementById("sub").innerHTML =
    `${new Date(stats.timestamp).toLocaleString("zh-CN")} · ${stats.full?"full 源集":"base 源集"} · 耗时 ${stats.duration_s.toFixed(1)}s`;

  document.getElementById("cards").innerHTML = [
    ["总规则", fmt(total), ""],
    ["accelerate", fmt(b.accelerate), "var(--acc)"],
    ["easylist (AGH)", fmt(b.easylist), "var(--easy)"],
    ["adblock (uBO)", fmt(b.adblock), "var(--ad)"],
    ["源", `${stats.total_sources - failed.length}/${stats.total_sources}`, failed.length?"var(--warn)":"var(--ok)"],
    ["输入行", fmt(stats.raw_lines), ""],
  ].map(([k,v,c])=>`<div class="card"><div class="k">${k}</div><div class="v" style="color:${c||"inherit"}">${v}</div></div>`).join("");

  new Chart(document.getElementById("buckets"), {
    type:"doughnut",
    data:{labels:["accelerate","easylist (AGH)","adblock (uBO)"],
      datasets:[{data:[b.accelerate,b.easylist,b.adblock],
        backgroundColor:["#58a6ff","#3fb950","#bc8cff"],borderWidth:0}]},
    options:{plugins:{legend:{labels:{color:"#e6e9ef",boxWidth:12}}},cutout:"58%"}
  });

  const sc = (stats.source_contrib||[]).filter(s=>s.domains>0).slice(0,15);
  document.getElementById("contrib").innerHTML = sc.length ? `<table>
    <tr><th>源</th><th>域名</th><th>字节</th><th>耗时</th></tr>
    ${sc.map(s=>`<tr><td class="url" title="${s.url}">${s.url.replace(/^https?:\/\//,"")}</td>
      <td class="n">${fmt(s.domains)}</td><td class="n">${fmt(s.bytes)}</td>
      <td class="n">${s.duration_s.toFixed(1)}s</td></tr>`).join("")}
  </table>` : '<div class="empty">无数据</div>';

  document.getElementById("failed").innerHTML = failed.length
    ? `<div class="fail bad">共 ${failed.length} 个源失败</div><div style="margin-top:8px">${failed.map(u=>`<div class="fail">· ${u.replace(/^https?:\/\//,"")}</div>`).join("")}</div>`
    : '<div class="ok">全部源抓取成功</div>';

  try {
    const txt = await (await fetch(H,{cache:"no-store"})).text();
    const rows = txt.split("\n").filter(Boolean).map(l=>JSON.parse(l)).slice(-30);
    new Chart(document.getElementById("trend"), {
      type:"line",
      data:{labels:rows.map(r=>new Date(r.timestamp).toLocaleDateString("zh-CN")),
        datasets:[
          {label:"easylist",data:rows.map(r=>r.buckets.easylist),borderColor:"#3fb950",tension:.3,pointRadius:0},
          {label:"adblock",data:rows.map(r=>r.buckets.adblock),borderColor:"#bc8cff",tension:.3,pointRadius:0},
          {label:"accelerate",data:rows.map(r=>r.buckets.accelerate),borderColor:"#58a6ff",tension:.3,pointRadius:0},
        ]},
      options:{plugins:{legend:{labels:{color:"#e6e9ef",boxWidth:12}}},
        scales:{x:{ticks:{color:"#8b94a7",maxTicksLimit:6},grid:{color:"#232733"}},
                y:{ticks:{color:"#8b94a7"},grid:{color:"#232733"}}}}
    });
  } catch(e){}
}
main();
</script>
</body>
</html>
