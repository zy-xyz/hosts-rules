<!DOCTYPE html>
<html lang="zh-cn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<title>hosts-rules · 规则构建状态</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --txt:#f2f4f8;--dim:#a3adc2;
  --acc:#6ea8ff;--easy:#4ade80;--ad:#c084fc;
  --glass:rgba(255,255,255,.075);--glass-2:rgba(255,255,255,.042);
  --stroke:rgba(255,255,255,.16);--hair:rgba(255,255,255,.07);
  --radius:26px;
  --shadow:inset 0 1px 1px rgba(255,255,255,.10),inset 0 -1px 1px rgba(0,0,0,.30),
           0 18px 40px -12px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
body{
  margin:0;color:var(--txt);background:#05070c;
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Noto Sans CJK SC",sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.aurora{position:fixed;inset:-20%;z-index:-1;filter:blur(70px) saturate(150%);opacity:.72;pointer-events:none}
.aurora i{position:absolute;display:block;border-radius:50%;mix-blend-mode:screen}
.aurora i:nth-child(1){width:46vw;height:46vw;left:-6vw;top:-10vw;background:radial-gradient(circle,#2a6cf0,transparent 62%);animation:d1 26s ease-in-out infinite alternate}
.aurora i:nth-child(2){width:40vw;height:40vw;right:-8vw;top:6vw;background:radial-gradient(circle,#a855f7,transparent 62%);animation:d2 32s ease-in-out infinite alternate}
.aurora i:nth-child(3){width:52vw;height:52vw;left:22vw;bottom:-24vw;background:radial-gradient(circle,#10b981,transparent 62%);animation:d3 38s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate3d(6vw,4vw,0) scale(1.12)}}
@keyframes d2{to{transform:translate3d(-5vw,7vw,0) scale(1.08)}}
@keyframes d3{to{transform:translate3d(3vw,-6vw,0) scale(1.15)}}
.wrap{max-width:1080px;margin:0 auto;padding:40px 20px 72px}
h1{font-size:27px;font-weight:640;letter-spacing:-.02em;margin:0 0 6px}
.sub{color:var(--dim);font-size:13px;margin-bottom:26px}
.card,.panel{
  position:relative;border-radius:var(--radius);
  background:linear-gradient(160deg,var(--glass),var(--glass-2));
  border:1px solid var(--stroke);
  backdrop-filter:blur(26px) saturate(190%);
  -webkit-backdrop-filter:blur(26px) saturate(190%);
  box-shadow:var(--shadow);overflow:hidden;
}
.card::before,.panel::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.20),rgba(255,255,255,0) 42%)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px;margin-bottom:18px}
.card{padding:16px 18px}
.card .k{color:var(--dim);font-size:11.5px;text-transform:uppercase;letter-spacing:.08em}
.card .v{font-size:27px;font-weight:620;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.panel{padding:18px}
.panel h2{font-size:12.5px;margin:0 0 14px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.09em}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--hair)}
th{color:var(--dim);font-weight:500}
tr:last-child td{border-bottom:0}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.url{max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,SFMono-Regular,monospace;font-size:12px}
.ok{color:var(--easy)}.warn{color:#fbbf24}.bad{color:#ff6b6b}
.fail{font-family:ui-monospace,monospace;font-size:12px;word-break:break-all}
.empty{color:var(--dim);font-size:13px}
canvas{max-width:100%}
@media(prefers-reduced-motion:reduce){.aurora i{animation:none}}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="wrap">
  <h1>hosts-rules</h1>
  <div class="sub" id="sub">加载中…</div>

  <div class="cards" id="cards"></div>

  <div class="grid">
    <div class="panel"><h2>三桶行数</h2><canvas id="buckets" height="200"></canvas></div>
    <div class="panel"><h2>趋势（最近 30 次）</h2><canvas id="trend" height="200"></canvas></div>
  </div>

  <div class="grid" style="margin-top:16px">
    <div class="panel"><h2>源贡献 Top 15</h2><div id="contrib"></div></div>
    <div class="panel"><h2>抓取失败</h2><div id="failed"></div></div>
  </div>
</div>

<script>
const S = "{{ "data/stats.json" | relURL }}";
const H = "{{ "data/history.jsonl" | relURL }}";
const fmt = n => (n ?? 0).toLocaleString("en-US");

async function main(){
  let stats;
  try { stats = await (await fetch(S, {cache:"no-store"})).json(); }
  catch(e){ document.getElementById("sub").textContent = "尚无构建数据（stats.json 未生成）"; return; }

  const b = stats.buckets;
  const total = b.accelerate + b.easylist + b.adblock;
  const failed = stats.failed_sources || [];

  document.getElementById("sub").innerHTML =
    `${new Date(stats.timestamp).toLocaleString("zh-CN")} · ${stats.full?"full 源集":"base 源集"} · 耗时 ${stats.duration_s.toFixed(1)}s`;

  document.getElementById("cards").innerHTML = [
    ["总规则", fmt(total), ""],
    ["accelerate", fmt(b.accelerate), "var(--acc)"],
    ["easylist (AGH)", fmt(b.easylist), "var(--easy)"],
    ["adblock (uBO)", fmt(b.adblock), "var(--ad)"],
    ["源", `${stats.total_sources - failed.length}/${stats.total_sources}`, failed.length?"var(--warn)":"var(--ok)"],
    ["输入行", fmt(stats.raw_lines), ""],
  ].map(([k,v,c])=>`<div class="card"><div class="k">${k}</div><div class="v" style="color:${c||"inherit"}">${v}</div></div>`).join("");

  new Chart(document.getElementById("buckets"), {
    type:"doughnut",
    data:{labels:["accelerate","easylist (AGH)","adblock (uBO)"],
      datasets:[{data:[b.accelerate,b.easylist,b.adblock],
        backgroundColor:["#6ea8ff","#4ade80","#c084fc"],borderWidth:0}]},
    options:{plugins:{legend:{labels:{color:"#f2f4f8",boxWidth:12}}},cutout:"58%"}
  });

  const sc = (stats.source_contrib||[]).filter(s=>s.domains>0).slice(0,15);
  document.getElementById("contrib").innerHTML = sc.length ? `<table>
    <tr><th>源</th><th>域名</th><th>字节</th><th>耗时</th></tr>
    ${sc.map(s=>`<tr><td class="url" title="${s.url}">${s.url.replace(/^https?:\/\//,"")}</td>
      <td class="n">${fmt(s.domains)}</td><td class="n">${fmt(s.bytes)}</td>
      <td class="n">${s.duration_s.toFixed(1)}s</td></tr>`).join("")}
  </table>` : '<div class="empty">无数据</div>';

  document.getElementById("failed").innerHTML = failed.length
    ? `<div class="fail bad">共 ${failed.length} 个源失败</div><div style="margin-top:8px">${failed.map(u=>`<div class="fail">· ${u.replace(/^https?:\/\//,"")}</div>`).join("")}</div>`
    : '<div class="ok">全部源抓取成功</div>';

  try {
    const txt = await (await fetch(H,{cache:"no-store"})).text();
    const rows = txt.split("\n").filter(Boolean).map(l=>JSON.parse(l)).slice(-30);
    new Chart(document.getElementById("trend"), {
      type:"line",
      data:{labels:rows.map(r=>new Date(r.timestamp).toLocaleDateString("zh-CN")),
        datasets:[
          {label:"easylist",data:rows.map(r=>r.buckets.easylist),borderColor:"#4ade80",tension:.3,pointRadius:0},
          {label:"adblock",data:rows.map(r=>r.buckets.adblock),borderColor:"#c084fc",tension:.3,pointRadius:0},
          {label:"accelerate",data:rows.map(r=>r.buckets.accelerate),borderColor:"#6ea8ff",tension:.3,pointRadius:0},
        ]},
      options:{plugins:{legend:{labels:{color:"#f2f4f8",boxWidth:12}}},
        scales:{x:{ticks:{color:"#a3adc2",maxTicksLimit:6},grid:{color:"rgba(255,255,255,.08)"}},
                y:{ticks:{color:"#a3adc2"},grid:{color:"rgba(255,255,255,.08)"}}}}
    });
  } catch(e){}
}
main();
</script>
</body>
</html>
